name: Deploy
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Fira Code
        shell: bash
        run: |
          set -euo pipefail

          FONT_DIR="$HOME/.local/share/fonts"
          mkdir -p "$FONT_DIR"

          curl -fL \
            https://github.com/tonsky/FiraCode/releases/download/6.2/Fira_Code_v6.2.zip \
            -o /tmp/fira-code.zip

          unzip -o /tmp/fira-code.zip -d /tmp/fira-code

          find /tmp/fira-code -type f \( -iname '*.ttf' -o -iname '*.otf' \) \
            -exec cp {} "$FONT_DIR/" \;

          fc-cache -f

          fc-list | grep -i "Fira Code"
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: npm install
      - run: npx nuxt build --preset github_pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./.output/public
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    # Deploy to the github_pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
